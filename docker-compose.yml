services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: squad_manager
    volumes:
      - ./backend/db.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports: 
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/squad_manager
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN}
    depends_on: 
      - postgres
  frontend:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    depends_on:
      - backend
  frontend-dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: