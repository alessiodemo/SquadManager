services:
  llm-service:
      build: 
        ./backend/services/llm_interaction
      ports: 
        - "8000:8000"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: squad_manager
    volumes:
      - ./backend/db.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  spring:
    build:
      context: ./backend-spring
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/squad_manager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - postgres

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/squad_manager
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN}
      LLM_SERVICE_URL: http://llm-service:8000
    depends_on:
      - postgres
      - llm-service

  frontend:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    depends_on:
      - backend

  frontend-dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: