apiVersion: v1
kind: Secret
metadata:
  name: squadmanager-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  FOOTBALL_DATA_TOKEN: {{ .Values.secrets.footballDataToken | b64enc | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | b64enc | quote }}
  LLM_PROVIDER: {{ .Values.secrets.llmProvider | b64enc | quote }}